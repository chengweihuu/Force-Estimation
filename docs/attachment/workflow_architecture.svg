<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1664" viewBox="0 0 1800 1664" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">个人科研工作流：单一研究主线、分阶段实验与按需网页审阅</title>
  <desc id="diagram-description">普通维护按会话授权直接修改和验证，无需创建科研任务。科学研究从 THINK 讨论开始，用户确认方向后准备唯一 Active TASK，后续执行。EXPLORE、VALIDATE 和 FORMAL 按需推进，阶段升级由研究者确认并保留同一 H-task。每阶段先做最低成本的失败检查，固定判据通过后才执行预算内后续步骤；失败停止并保存待审记忆。TASK、检查点和 Research Wiki 恢复主线，支线暂存。失败记忆经权威对象审阅和用户接受后进入 Wiki 索引。可选网页审阅由用户手动交接 REVIEW_PACKET.md 和完整 REVIEW_FEEDBACK.md，Codex 另行逐项回应，建议不能替代科学裁决。科学关闭经研究者接受后更新权威对象与 CURRENT。Codex 使用 CLI，Pi 可通过工具与 hooks 接入同一实现。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#728397"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#237967"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ae7022"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b45350"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #182b40; }
      .title { font-size: 36px; font-weight: 700; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #53667b; }
      .tiny { font-size: 14px; fill: #53667b; }
      .mono { font-family: "DejaVu Sans Mono", "Noto Sans CJK SC", monospace; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
      .edge { fill: none; stroke: #728397; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <!-- Header -->
  <rect x="0" y="0" width="1800" height="1664" rx="0" fill="#f4f6f8" stroke="#f4f6f8"/>
  <text x="48" y="66" class="title">个人科研工作流</text>
  <text x="48" y="103" class="body" style="fill:#53667b">一次只推进一个研究问题。Explore fast. Validate cleanly. Formalize once.</text>
  <rect x="1464" y="42" width="288" height="28" rx="14" fill="#e4ebf3" stroke="#e4ebf3"/>
  <text x="1608.0" y="62" class="tiny" style="font-weight:700;fill:#3b526a" text-anchor="middle">单一研究主线 · 单 Executor</text>
  <text x="1752" y="105" class="small" text-anchor="end">文件保存边界，检查点保存进度，人决定科学含义。</text>
  <!-- Entry paths: routine maintenance and scientific task preparation -->
  <rect x="48" y="136" width="496" height="148" rx="14" fill="#ffffff" stroke="#dce3e9"/>
  <text x="72" y="171" class="heading">普通维护</text>
  <rect x="405" y="151" width="115" height="28" rx="14" fill="#e9eff5" stroke="#e9eff5"/>
  <text x="462.5" y="171" class="tiny" style="font-weight:700;fill:#3b526a" text-anchor="middle">无需 TASK</text>
  <text x="72" y="203" class="body">已授权的小修改、文档与测试</text>
  <text x="72" y="234" class="body" style="font-weight:700">直接修改 → 验证 → 报告</text>
  <text x="72" y="262" class="small">TASK 保持 Inactive；无需实验阶梯或科研关闭流程。</text>
  <rect x="568" y="136" width="1184" height="148" rx="14" fill="#edf3fa" stroke="#ceddee"/>
  <text x="592" y="171" class="heading">科学研究：先定义当前唯一问题</text>
  <text x="592" y="211" class="body" style="font-size:22px;font-weight:700">THINK 只读讨论  →  用户确认方向  →  准备 TASK  →  后续开始执行</text>
  <text x="592" y="252" class="body" style="fill:#53667b">先核对 Git 基线；任务准备与执行分步进行。研究者确认科学含义、阶段变化和结果接受。</text>
  <path d="M 636 284 L 636 318" class="edge"/>
  <!-- 01: authoritative control state and three scientific stages -->
  <rect x="48" y="324" width="1176" height="566" rx="14" fill="#ffffff" stroke="#dce3e9"/>
  <text x="72" y="360" class="heading">01  当前主线与阶段</text>
  <text x="1200" y="359" class="small" text-anchor="end">PROJECT = 长期边界     CURRENT = 当前坐标     TASK = 唯一行动</text>
  <rect x="72" y="382" width="1128" height="104" rx="10" fill="#f4f7fb" stroke="#e2e9f0"/>
  <text x="92" y="414" class="label">PROJECT.md</text>
  <text x="92" y="447" class="small">长期目标与项目边界</text>
  <line x1="294" y1="399" x2="294" y2="468" stroke="#dce3e9" stroke-width="1"/>
  <text x="318" y="414" class="label">CURRENT.md</text>
  <text x="318" y="447" class="small">接受状态、对象指针与下一项决策</text>
  <line x1="623" y1="399" x2="623" y2="468" stroke="#dce3e9" stroke-width="1"/>
  <text x="648" y="414" class="label">TASK.md · 唯一 Active 科学任务</text>
  <text x="648" y="447" class="small">问题 / Stage / 范围 / 预算 / 验收 / 停止条件</text>
  <text x="648" y="473" class="tiny">Progress 只保留当前检查点；日志通过路径引用。</text>
  <text x="72" y="520" class="body" style="font-weight:700">同一 H-task 内按需推进；每次阶段变化由用户确认。</text>
  <rect x="72" y="540" width="350" height="226" rx="12" fill="#edf7f2" stroke="#edf7f2"/>
  <rect x="72" y="540" width="5" height="226" rx="2" fill="#237967" stroke="#237967"/>
  <text x="94" y="579" style="font-size:25px;font-weight:700;fill:#237967">EXPLORE</text>
  <text x="400" y="579" class="small" style="font-weight:700;fill:#237967" text-anchor="end">快速探索</text>
  <text x="94" y="616" class="body" style="font-size:17px">当前 probe：先找反例与失败信号</text>
  <text x="94" y="645" class="body" style="font-size:17px">声明成本上限、失败与停止条件</text>
  <text x="94" y="674" class="body" style="font-size:17px">可迭代设计；不默认冻结或 hash</text>
  <text x="94" y="705" class="tiny">scratch/&lt;task-id&gt;/ · 可丢弃探索</text>
  <line x1="94" y1="719" x2="400" y2="719" stroke="#d6dee6" stroke-width="1"/>
  <text x="94" y="748" class="body" style="font-size:18px;font-weight:700;fill:#237967">机制是否值得继续？</text>
  <rect x="461" y="540" width="350" height="226" rx="12" fill="#edf3fb" stroke="#edf3fb"/>
  <rect x="461" y="540" width="5" height="226" rx="2" fill="#306cb2" stroke="#306cb2"/>
  <text x="483" y="579" style="font-size:25px;font-weight:700;fill:#306cb2">VALIDATE</text>
  <text x="789" y="579" class="small" style="font-weight:700;fill:#306cb2" text-anchor="end">受控验证</text>
  <text x="483" y="616" class="body" style="font-size:17px">观察 endpoint 前固定比较设计</text>
  <text x="483" y="645" class="body" style="font-size:17px">处理 / 基线 / 指标 / 样本与种子</text>
  <text x="483" y="674" class="body" style="font-size:17px">保存可重放的代码、配置与环境</text>
  <text x="483" y="705" class="tiny">验证结果不能追溯晋级为 Claim 级证据</text>
  <line x1="483" y1="719" x2="789" y2="719" stroke="#d6dee6" stroke-width="1"/>
  <text x="483" y="748" class="body" style="font-size:18px;font-weight:700;fill:#306cb2">受控比较能否成立？</text>
  <rect x="850" y="540" width="350" height="226" rx="12" fill="#f2effa" stroke="#f2effa"/>
  <rect x="850" y="540" width="5" height="226" rx="2" fill="#7552a7" stroke="#7552a7"/>
  <text x="872" y="579" style="font-size:25px;font-weight:700;fill:#7552a7">FORMAL</text>
  <text x="1178" y="579" class="small" style="font-weight:700;fill:#7552a7" text-anchor="end">正式证据</text>
  <text x="872" y="616" class="body" style="font-size:17px">受控验证通过且需要 Claim 证据</text>
  <text x="872" y="645" class="body" style="font-size:17px">冻结协议 / holdout / request</text>
  <text x="872" y="674" class="body" style="font-size:17px">绑定 commit、环境、数据与 hash</text>
  <text x="872" y="705" class="tiny">完整证据链 + 研究者接受</text>
  <line x1="872" y1="719" x2="1178" y2="719" stroke="#d6dee6" stroke-width="1"/>
  <text x="872" y="748" class="body" style="font-size:18px;font-weight:700;fill:#7552a7">是否足以支持正式主张？</text>
  <path d="M 429 648 L 451 648" class="edge"/>
  <path d="M 818 648 L 840 648" class="edge"/>
  <rect x="72" y="787" width="1128" height="80" rx="10" fill="#f6f8fa" stroke="#f6f8fa"/>
  <text x="92" y="815" class="body" style="font-size:18px">计算规模与研究阶段分开：probe → pilot → scale 只列已计划级别；FORMAL 按证据需要启用。</text>
  <text x="92" y="846" class="small">科学问题实质变化才新建 H-task；执行层维护留在当前任务，超出范围或预算时先修订授权。</text>
  <path d="M 636 890 L 636 912" class="edge"/>
  <!-- 02: context restoration, protected mainline and parked sidelines -->
  <rect x="1256" y="324" width="496" height="258" rx="14" fill="#ffffff" stroke="#dce3e9"/>
  <text x="1280" y="361" class="heading">02  从文件恢复主线</text>
  <text x="1280" y="403" class="body" style="font-weight:700">TASK + Progress 检查点 + Wiki</text>
  <text x="1280" y="437" class="body">→ 原问题 / 范围 / 预算 / 下一步</text>
  <text x="1280" y="471" class="body">支线 park 暂存，不取得执行权限</text>
  <text x="1280" y="505" class="body">合同、请求或输入变化 → 阻止续跑</text>
  <rect x="1280" y="527" width="448" height="34" rx="8" fill="#edf3fa" stroke="#edf3fa"/>
  <text x="1294" y="550" class="small">CLI：context  ·  Pi：每次启动自动注入</text>
  <!-- 03: failure memory retains authority pointers and requires human acceptance -->
  <rect x="1256" y="606" width="496" height="284" rx="14" fill="#ffffff" stroke="#dce3e9"/>
  <text x="1280" y="643" class="heading">03  失败留下可检索记忆</text>
  <text x="1280" y="681" class="body" style="font-weight:700;fill:#a25736">失败 / 预算停止 / 中断</text>
  <text x="1280" y="715" class="body" style="font-size:17px">↓ failure-memory.pending.json</text>
  <text x="1280" y="749" class="body">审阅权威 Idea / Experiment 的状态</text>
  <text x="1280" y="783" class="body">↓ 展示索引 diff → 用户接受</text>
  <text x="1280" y="817" class="body" style="font-weight:700;fill:#237967">docs/RESEARCH_WIKI.md</text>
  <text x="1280" y="849" class="small" style="font-size:15px">执行失败不自动否定 Idea；Wiki 只作索引。</text>
  <text x="1280" y="874" class="small" style="font-size:15px">保存边界、教训与重启条件；恢复时检索，关闭时查漏。</text>
  <path d="M 1752 814 L 1776 814 L 1776 402 L 1756 402" class="edge" style="stroke:#237967;marker-end:url(#arrow-green)"/>
  <!-- 04: cheap-first execution, fixed predicates, reserved budgets, durable records -->
  <rect x="48" y="918" width="1176" height="294" rx="14" fill="#ffffff" stroke="#dce3e9"/>
  <text x="72" y="955" class="heading">04  先便宜地失败，再执行昂贵步骤</text>
  <text x="72" y="984" class="small">每个阶段：成本不递减；执行前预留预算与时间；固定判据决定能否继续。</text>
  <rect x="72" y="1006" width="224" height="86" rx="10" fill="#f3f6fa" stroke="#dce3e9"/>
  <text x="88" y="1039" class="body" style="font-size:20px;font-weight:700">已批准 request</text>
  <text x="88" y="1072" class="tiny">实际 argv · 预算 · 停止规则</text>
  <rect x="332" y="1006" width="232" height="86" rx="10" fill="#edf7f2" stroke="#cce3d8"/>
  <text x="348" y="1039" class="body" style="font-size:20px;font-weight:700;fill:#237967">最低成本失败检查</text>
  <text x="348" y="1072" class="small" style="font-size:15px">只执行下一项已批准步骤</text>
  <rect x="600" y="1006" width="220" height="86" rx="10" fill="#fff6e6" stroke="#ecd8b5"/>
  <text x="615" y="1039" class="body" style="font-size:19px;font-weight:700;fill:#966020">全部固定判据通过？</text>
  <text x="615" y="1072" class="small" style="font-size:15px">按已批准规则检查结果</text>
  <rect x="856" y="1006" width="344" height="86" rx="10" fill="#edf3fa" stroke="#ceddee"/>
  <text x="874" y="1039" class="body" style="font-size:20px;font-weight:700;fill:#306cb2">通过 → 更高成本的下一步</text>
  <text x="874" y="1072" class="small" style="font-size:15px">仍在当前预算与阶段内；按需升级规模</text>
  <path d="M 296 1049 L 322 1049" class="edge"/>
  <path d="M 564 1049 L 590 1049" class="edge"/>
  <path d="M 820 1049 L 846 1049" class="edge"/>
  <path d="M 710 1092 L 710 1116" class="edge" style="stroke:#b45350;marker-end:url(#arrow-red)"/>
  <rect x="600" y="1120" width="600" height="66" rx="10" fill="#fcf0ee" stroke="#edd0cb"/>
  <text x="616" y="1147" class="body" style="font-size:18px;font-weight:700;fill:#a54845">失败 / 缺失结果 / 超时 / 预算不足 → 停止</text>
  <text x="616" y="1173" class="tiny">不自动重试或扩预算；保留不利记录，进入待审记忆（03）。</text>
  <text x="72" y="1137" class="body" style="font-size:17px">输出：runs/&lt;task-id&gt;/&lt;run-id&gt;/</text>
  <text x="72" y="1164" class="small">检查点、输入快照、每步结果与日志</text>
  <text x="72" y="1190" class="tiny">TASK 仅更新 Progress 指针；正常暂停可续跑。</text>
  <path d="M 636 1212 L 636 1230" class="edge"/>
  <!-- 05: content-level scientific closeout and formal-only evidence chain -->
  <rect x="48" y="1236" width="1176" height="190" rx="14" fill="#ffffff" stroke="#dce3e9"/>
  <text x="72" y="1273" class="heading" style="font-size:22px">05  科学关闭：先展示具体内容，再由研究者确认</text>
  <rect x="72" y="1296" width="348" height="55" rx="9" fill="#f3f6fa" stroke="#e0e7ee"/>
  <rect x="453" y="1296" width="348" height="55" rx="9" fill="#f3f6fa" stroke="#e0e7ee"/>
  <rect x="834" y="1296" width="366" height="55" rx="9" fill="#f3f6fa" stroke="#e0e7ee"/>
  <text x="246" y="1330" class="body" style="font-size:16px;font-weight:700" text-anchor="middle">Result · Evidence · 不确定性 · 下一步</text>
  <text x="627" y="1330" class="body" style="font-size:17px;font-weight:700" text-anchor="middle">获批后更新权威对象 + CURRENT</text>
  <text x="1017" y="1330" class="body" style="font-size:17px;font-weight:700" text-anchor="middle">TASK → Inactive · 回到下一项决策</text>
  <path d="M 425 1323 L 447 1323" class="edge"/>
  <path d="M 806 1323 L 828 1323" class="edge"/>
  <text x="72" y="1385" class="body" style="font-size:16px;font-weight:700;fill:#7552a7">仅 FORMAL：Claim → Frozen Protocol → immutable request → Run → Experiment → Idea Evidence Map</text>
  <text x="72" y="1411" class="small" style="font-size:15px">冻结规则产生 ProtocolOutcome；研究者接受后才能支持 Claim。LLM 建议与工作流检查点不属于 Evidence。</text>
  <path d="M 48 1323 L 24 1323 L 24 434 L 44 434" class="edge"/>
  <!-- Optional manual web review: no automated model call, original feedback kept separate -->
  <rect x="1256" y="918" width="496" height="508" rx="14" fill="#fffdf8" stroke="#d9bb87" stroke-dasharray="7 5"/>
  <text x="1280" y="956" class="heading" style="fill:#966020">按需网页审阅</text>
  <rect x="1664" y="934" width="64" height="28" rx="14" fill="#fff0d1" stroke="#fff0d1"/>
  <text x="1696.0" y="954" class="tiny" style="font-weight:700;fill:#966020" text-anchor="middle">可选</text>
  <text x="1280" y="985" class="small">Codex executor + ChatGPT / DeepSeek 网页</text>
  <rect x="1280" y="1006" width="448" height="65" rx="10" fill="#ffffff" stroke="#e8dcc4"/>
  <text x="1298" y="1033" class="body" style="font-weight:700">1  导出 REVIEW_PACKET.md</text>
  <text x="1298" y="1058" class="tiny">一页主线 + 编号原文 + 已登记结果（含不利记录）</text>
  <path d="M 1504 1071 L 1504 1088" class="edge" style="stroke:#ae7022;marker-end:url(#arrow-amber)" stroke-dasharray="4 4"/>
  <rect x="1280" y="1094" width="448" height="55" rx="10" fill="#fff3db" stroke="#e8dcc4"/>
  <text x="1298" y="1128" class="body" style="font-size:18px;font-weight:700">2  你发送到网页 AI，再带回完整反馈</text>
  <path d="M 1504 1149 L 1504 1167" class="edge" style="stroke:#ae7022;marker-end:url(#arrow-amber)" stroke-dasharray="4 4"/>
  <rect x="1280" y="1173" width="448" height="65" rx="10" fill="#ffffff" stroke="#e8dcc4"/>
  <text x="1298" y="1200" class="body" style="font-weight:700">3  保存 REVIEW_FEEDBACK.md 原文</text>
  <text x="1298" y="1225" class="small" style="font-size:15px">Codex 按 R 编号另行回应；分歧保留。</text>
  <text x="1280" y="1268" class="small" style="font-size:15px">用于主线检查或通俗解释；无需每次实验都审阅。</text>
  <rect x="1280" y="1286" width="448" height="82" rx="8" fill="#f7f2e8" stroke="#f7f2e8"/>
  <text x="1292" y="1309" class="tiny">运行前：scratch/&lt;task-id&gt;/review/01/</text>
  <text x="1292" y="1333" class="tiny" style="font-size:13px">已有 Run：runs/&lt;task-id&gt;/&lt;run-id&gt;/review/01/</text>
  <text x="1292" y="1357" class="tiny">后续 02、03…；review list 返回文件链接。</text>
  <text x="1280" y="1390" class="small" style="font-size:15px">发送前检查缺失、未附与过期；不自动上传。</text>
  <text x="1280" y="1413" class="small" style="font-size:15px">仅作建议，不代替科学裁决或触发阶段升级。</text>
  <!-- Implementation entry points and scientific/execution separation -->
  <rect x="48" y="1454" width="1704" height="152" rx="14" fill="#e9eef4" stroke="#d9e1eb"/>
  <text x="72" y="1489" class="body" style="font-size:19px;font-weight:700">Codex：CLI 显式调用  ·  Pi（可选宿主）：工具、上下文注入与写入关卡</text>
  <text x="72" y="1526" class="mono" style="font-size:18px">node tools/research-workflow.mjs  →  context / flow / wiki / review</text>
  <text x="72" y="1563" class="small">Pi 复用同一实现；其 hooks 不在 Codex 中自动运行。当前外部审阅通过人工交接。</text>
  <line x1="1032" y1="1478" x2="1032" y2="1588" stroke="#cad5e1" stroke-width="1"/>
  <text x="1056" y="1489" class="body" style="font-size:19px;font-weight:700">依赖方向</text>
  <text x="1056" y="1523" class="body" style="font-size:17px;font-weight:700">Scientific Core → Generic Execution Contract</text>
  <text x="1056" y="1550" class="body" style="font-size:17px;font-weight:700">→ Experiment Binding → Carrier / Host</text>
