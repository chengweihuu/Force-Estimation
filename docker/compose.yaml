# Single project entry: docker compose -f docker/compose.yaml build
# Starts a shell by default; no controller, simulation or robot driver is launched.
name: piakf
services:
  piakf:
    image: piakf:jazzy-mujoco3.12.0-control0.1.2
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    user: "${PIAKF_UID:-1000}:${PIAKF_GID:-1000}"
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace
    # Runtime isolation only. Build still needs network access for apt/pip.
    network_mode: none
    environment:
      MUJOCO_GL: osmesa
      MPLBACKEND: Agg
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_DOMAIN_ID: "97"
    volumes:
      - type: bind
        source: ..
        target: /workspace
        bind:
          create_host_path: false
    cpus: 2.0
    mem_limit: 4g
    shm_size: 256m
    command: ["bash"]
